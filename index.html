<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Libary</title>
</head>

<body>
    <div id="bookshelf">

    </div>
    <button id="newBookBtn"> Add Book</button>
    <form id="newBookForm" class="hidden">
        <label>Book Title</label>
        <input type="text" id="title" name="title" class="text-input" required>
        <label>Author</label>
        <input type="text" id="author" name="author" class="text-input" required>
        <label>Pages</label>
        <input type="number" id="pages" name="pages" class="number-input" required>
        <label>Read?</label>
        <input type="checkbox" id="read" name="read" class="text-input">
        <button id="addBtn">Add</button>
    </form>
</body>

</html>
