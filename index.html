<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Libary</title>
</head>

<body>
    <div id="bookshelf">

    </div>
    <button id="newBookBtn"> Add Book</button>
    <form id="newBookForm" class="hidden">
        <input type="text" id="author" name="author" class="text-input bookAuthor" placeholder="Author">
        <input type="text" id="title" name="title" class="text-input bookTitle" placeholder="Title" required>
        <input type="number" id="pages" name="pages" class="number-input bookPages" placeholder="Pages" required>
        <div class="readContainer">
            <label class="readText" for="read">Read?</label>
            <input type="checkbox" id="read" name="read" class="text-input bookRead" placeholder="read">
        </div>
        <button id="addBtn">Add</button>
    </form>
</body>

</html>
